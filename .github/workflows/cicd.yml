name: cicd file sda

on:
  push:
    branches: ["main"]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: install code
        uses: actions/checkout@v4
      - name: install node js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: install package and run tests
        working-directory: ./backend
        run: |
          npm ci
          npm test

  build_and_pack:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: install code
        uses: actions/checkout@v4

      - name: install node js
        uses: actions/setup-node@v4

      - name: build react app
        working-directory: ./frontend
        run: |
          npm ci 
          npm run build

      - name: merge (Монтирование frontend в директорию backend)
        run: |
          mkdir -p ./backend/public 
          rm -rf ./backend/public/*
          cp -r ./frontend/dist/* ./backend/public/
      - name: build artifact
        run: |
          cd backend
          zip -r ../weather-report-app.zip . -x "*/node_modules/*"
      - name: save artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: weather-report-app.zip
          retention-days: 7

  deploy:
    needs: build_and_pack
    runs-on: ubuntu-latest
    steps:
      - name: install code
        uses: actions/checkout@v4
      - name: install artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .
      - name: install ssh key
        uses: webfactory/shh-agent@v0.9.0
        with:
          ssh-private-key: ${{secrets.SHH_PRIVATE_KEY}}
      - name: install ansible
        run: |
          sudo apt-get update 
          sudo apt-get install -y ansible
      - name: run ansible
        working-directory: ./ansible
        run: |
          echo "${{secrets.VAULT_PASSWORD}}" > .vault_pass.txt
          ansible-playbook -i inventory.ini deploy.yml --vault-password-file .vault_pass.txt -vvv
          rm .vault_pass.txt
