name: cicd file 2

on:
  push:
    branches: ["main"]

jobs:

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: install code
        uses: actions/checkout@v4
      - name: install node js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: install package and run tests
        working-directory: ./backend
        run: |
          npm ci
          npm test

  build_and_pack:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: install code
        uses: actions/checkout@v4

      - name: install node js
        uses: actions/setup-node@v4

      - name: build react app
        working-directory: ./frontend
        run: |
          npm ci 
          npm run build

      - name: merge (Монтирование frontend в директорию backend)
        run: |
          mkdir -p ./backend/public 
          rm -rf ./backend/public/*
          cp -r ./frontend/dist/* ./backend/public/
      - name: build artifact
        run: |
          cd backend
          zip -r ../weather-report-app.zip . -x "*/node_modules/*"
      - name: save artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: weather-report-app.zip
          retention-days: 7

  deploy:
    needs: build_and_pack
    runs-on: ubuntu-latest
    steps:
      - name: install code
        uses: actions/checkout@v4
      - name: install artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .
      - name: install ssh key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{secrets.SSH_PRIVATE_KEY}}
      - name: install ansible
        run: |
          sudo apt-get update 
          sudo apt-get install -y ansible
          
      - name: run ansible
        working-directory: ./ansible
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASSWORD }}
        run: |
          # 1. Безопасно записываем пароль в файл
          cat << 'EOF' > .vault_pass.txt
          ${{ secrets.VAULT_PASSWORD }}
          EOF
          
          # 2. Убираем возможные пробелы/переносы строк из файла с паролем
          tr -d '\r\n ' < .vault_pass.txt > .vault_pass_clean.txt
          
          # 3. Явно прописываем путь к файлу с паролем в конфигурацию Ansible
          echo "vault_password_file = .vault_pass_clean.txt" >> ansible.cfg
          
          # 4. Запускаем playbook (аргументы просить больше не нужно, Ansible сам подтянет настройки из ansible.cfg)
          ansible-playbook -i inventory.ini deploy.yml -vvv
          
          # 5. Чистим за собой секретные файлы
          rm -f .vault_pass.txt .vault_pass_clean.txt

